name: 運行情報の更新

on:
  schedule:
    # 5分ごと・終日。GitHub 側の混雑で数分遅れることがある。
    - cron: '*/5 * * * *'
  workflow_dispatch:

# data ブランチを書き換える全ワークフローと直列化する。
# 別々のワークフローが同時に force push すると、片方の更新を消してしまうため。
concurrency:
  group: data-branch-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 運行情報を取得する
        run: node scripts/fetch-train.mjs > train.json

      - name: data ブランチへ上書きする
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # 履歴を1コミットに保つため、親を持たないコミットを作って毎回置き換える。
          # train-mail.json（中央線・青梅線、train-mail.ymlが書く）は自分のツリーに
          # 含まれていないと消えてしまうため、data ブランチの現状から引き継ぐ。
          git fetch origin data:data 2>/dev/null || true
          tree_entries="100644 blob $(git hash-object -w train.json)\ttrain.json"
          if git show data:train-mail.json > /tmp/train-mail.json 2>/dev/null; then
            blob2=$(git hash-object -w /tmp/train-mail.json)
            tree_entries="$tree_entries\n100644 blob $blob2\ttrain-mail.json"
          fi
          tree=$(printf "$tree_entries\n" | git mktree)
          commit=$(git commit-tree "$tree" -m "train data $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          git push -f origin "$commit:refs/heads/data"
