name: 相場・運行情報の更新

on:
  schedule:
    # 5分ごと・終日。GitHub 側の混雑で数分遅れることがある。
    - cron: '*/5 * * * *'
  workflow_dispatch:

# 同じワークフローが重なったときは、新しい方だけを残す。
concurrency:
  group: market-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 相場を取得する
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node scripts/fetch-market.mjs > market.json

      - name: 運行情報を取得する
        run: node scripts/fetch-train.mjs > train.json

      - name: data ブランチへ上書きする
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # 履歴を1コミットに保つため、親を持たないコミットを作って毎回置き換える。
          # 終日5分間隔でも、リポジトリの履歴が更新ログで埋まらないようにするため。
          market_blob=$(git hash-object -w market.json)
          train_blob=$(git hash-object -w train.json)
          tree=$(printf '100644 blob %s\tmarket.json\n100644 blob %s\ttrain.json\n' "$market_blob" "$train_blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "status data $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          git push -f origin "$commit:refs/heads/data"
