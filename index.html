<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="clock">
    <span id="clock-time" class="clock-time">--:--:--</span>
    <span id="clock-date" class="clock-date">----年--月--日（-）</span>
  </div>
  <div id="status-strip" class="status-strip"></div>
</header>

<main class="layout">

  <aside class="panel sidebar weekly-panel">
    <h2 class="block-title">昭島市 週間天気</h2>
    <div id="akishima-alerts" class="weekly-alerts"></div>
    <ul id="akishima-weekly-list" class="weekly-list">
      <li class="placeholder">読み込み中</li>
    </ul>

    <h2 class="block-title weekly-title-2">鹿沼市 週間天気</h2>
    <div id="kanuma-alerts" class="weekly-alerts"></div>
    <ul id="kanuma-weekly-list" class="weekly-list">
      <li class="placeholder">読み込み中</li>
    </ul>

    <h2 class="block-title train-title">運行情報</h2>
    <p class="train-note">遅延・見合わせがあるとリンクが赤くなります</p>
    <ul class="train-list">
      <li><a class="train-link" data-line="chuo" href="https://traininfo.jreast.co.jp/train_info/service.aspx" target="_blank" rel="noopener">中央線（JR東日本）</a></li>
      <li><a class="train-link" data-line="ome" href="https://traininfo.jreast.co.jp/train_info/service.aspx" target="_blank" rel="noopener">青梅線（JR東日本）</a></li>
      <li><a class="train-link" data-line="ginza" href="https://www.tokyometro.jp/index.html#UnkouLinesList" target="_blank" rel="noopener">銀座線（東京メトロ）</a></li>
    </ul>
  </aside>

  <div class="center">
    <section id="weather-row" class="weather-row">
      <div class="placeholder">天気を読み込み中</div>
    </section>

    <section class="pickup-today-row">
      <div class="panel pickup-block">
        <h2 class="block-title">来客・外出</h2>
        <ul id="visitor-list" class="pickup-list">
          <li class="placeholder">読み込み中</li>
        </ul>
      </div>

      <div class="panel pickup-block">
        <h2 class="block-title">タスク</h2>
        <ul id="task-list" class="pickup-list">
          <li class="placeholder">読み込み中</li>
        </ul>
      </div>

      <section class="panel today">
        <h2 class="block-title">
          今日の予定
          <span id="today-count" class="count"></span>
        </h2>
        <ul id="today-list" class="today-list">
          <li class="placeholder">読み込み中</li>
        </ul>
      </section>
    </section>

    <section class="week-row">
      <section class="panel week">
        <h2 class="block-title">これからの一週間</h2>
        <div id="week-list" class="week-list">
          <div class="placeholder">読み込み中</div>
        </div>
      </section>

      <!-- Googleカレンダーの公式埋め込み（閲覧専用・週表示、日付の切替えは可）。
           srcはjs/calendar.jsが認証後に組み立てる（メールアドレスをリポジトリに
           書かないため）。2026-08-08、「今日の予定」から「これからの一週間」の
           右隣りへ場所を移した。 -->
      <section class="panel week-calendar">
        <h2 class="block-title">カレンダー</h2>
        <iframe
          id="week-calendar-embed"
          class="week-calendar-embed is-hidden"
          title="カレンダー（Googleカレンダー）"
          loading="lazy"
        ></iframe>
        <div id="week-calendar-placeholder" class="placeholder">読み込み中</div>
      </section>
    </section>
  </div>

  <aside class="panel market">
    <h2 class="block-title">相場</h2>

    <div class="market-widgets">
      <div class="market-widget">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
          { "symbol": "OANDA:USDJPY", "colorTheme": "dark", "isTransparent": true, "locale": "ja", "width": "100%" }
          </script>
        </div>
      </div>

      <div class="market-widget">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
          { "symbol": "OANDA:JP225USD", "colorTheme": "dark", "isTransparent": true, "locale": "ja", "width": "100%" }
          </script>
        </div>
      </div>

      <div class="market-widget">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
          { "symbol": "COINBASE:XRPUSD", "colorTheme": "dark", "isTransparent": true, "locale": "ja", "width": "100%" }
          </script>
        </div>
      </div>

      <div class="market-widget">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
          { "symbol": "COINBASE:XLMUSD", "colorTheme": "dark", "isTransparent": true, "locale": "ja", "width": "100%" }
          </script>
        </div>
      </div>

      <div class="market-widget">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
          { "symbol": "OANDA:XAUUSD", "colorTheme": "dark", "isTransparent": true, "locale": "ja", "width": "100%" }
          </script>
        </div>
      </div>

      <div class="market-widget">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
          { "symbol": "OANDA:XAGUSD", "colorTheme": "dark", "isTransparent": true, "locale": "ja", "width": "100%" }
          </script>
        </div>
      </div>
    </div>

    <div class="market-foot">
      <a class="chart-link" href="https://iroha-ai.github.io/realtime-charts/" target="_blank" rel="noopener">チャートを見る</a>
    </div>
  </aside>

</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
